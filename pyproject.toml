[project]
name = "jamalong"
version = "0.1.0"
description = "Plays a MIDI melody along with live guitar chords, in key and in time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linkpython-extern>=1.3.0",
    "mido>=1.3.3",
    "numpy>=2.5.4",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.5.6",
]

[project.scripts]
jamalong = "jamalong.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
