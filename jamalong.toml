# Saved settings for `jamalong run` and `jamalong demo`.
# Any long option works here, with the leading dashes removed.

[run]
source = "live"        # listen to Ableton Live's output directly ("device" = an audio input)
roles = "lead,bass"    # any of: lead, bass, arp
capture-bars = 8
density = 0.5

[demo]
roles = "lead,bass"
